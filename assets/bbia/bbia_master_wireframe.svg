<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- BBIA Master SVG - Version Wireframe / System Debug -->
  <!-- Pour mode config, chargement ou debug -->
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FFFF" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Fond avec grille -->
  <rect id="debug-background" width="100%" height="100%" fill="url(#grid)" opacity="0.5"/>

  <!-- Robot en wireframe -->
  <g id="bbia-wireframe" stroke="#00AAFF" stroke-width="2" fill="none">
    <path id="body-wireframe" d="M150 280 C 150 280, 140 450, 250 450 C 360 450, 350 280, 350 280 Z"/>
    
    <g id="head-wireframe" transform="rotate(-15 250 250)">
      <rect id="head-case-wireframe" x="150" y="150" width="200" height="120" rx="30"/>
      <circle id="eye-left-wireframe" cx="210" cy="210" r="28" stroke-dasharray="4 2"/>
      <circle id="eye-right-wireframe" cx="290" cy="210" r="28" stroke-dasharray="4 2"/>
      <line id="antenna-left-wireframe" x1="200" y1="150" x2="180" y2="80" />
      <line id="antenna-right-wireframe" x1="300" y1="150" x2="320" y2="80" />
    </g>
  </g>
  
  <!-- Texte système -->
  <text id="system-status" x="250" y="480" text-anchor="middle" font-family="monospace" font-size="20" fill="#00AAFF">SYSTEM_READY</text>
</svg>

