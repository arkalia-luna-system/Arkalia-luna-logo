<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- BBIA Master SVG - Version Clean et Modulaire -->
  <!-- IDs sémantiques pour manipulation programmatique -->
  
  <g id="bbia-bot">
    <!-- Corps du robot -->
    <path id="body-shell" d="M150 280 C 150 280, 140 450, 250 450 C 360 450, 350 280, 350 280 L 150 280 Z" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- Jointure du cou -->
    <rect id="neck-joint" x="235" y="250" width="30" height="40" fill="#999"/>

    <!-- Groupe tête (rotatable) -->
    <g id="head-group" transform="rotate(-15 250 250)">
      <!-- Antennes -->
      <g id="antennas" stroke="#555" stroke-width="3">
        <line id="antenna-left" x1="200" y1="150" x2="180" y2="80" />
        <circle id="antenna-left-signal" cx="180" cy="80" r="4" fill="#555" stroke="none"/>
        <path id="antenna-left-base" d="M200 150 L 200 130" stroke-width="6" stroke="#AAA"/> 

        <line id="antenna-right" x1="300" y1="150" x2="320" y2="80" />
        <circle id="antenna-right-signal" cx="320" cy="80" r="4" fill="#555" stroke="none"/>
        <path id="antenna-right-base" d="M300 150 L 300 130" stroke-width="6" stroke="#AAA"/>
      </g>

      <!-- Boîtier de la tête -->
      <rect id="head-case" x="150" y="150" width="200" height="120" rx="30" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>

      <!-- Interface faciale -->
      <g id="face-interface">
        <!-- Ligne de séparation -->
        <line id="face-separator" x1="210" y1="210" x2="290" y2="210" stroke="#111" stroke-width="8"/>
        
        <!-- Œil gauche -->
        <g id="eye-left">
          <circle id="eye-left-outer" cx="210" cy="210" r="28" fill="#111"/>
          <circle id="pupil-left" cx="210" cy="210" r="12" fill="#00FFFF"/>
          <circle id="eye-left-highlight" cx="215" cy="205" r="5" fill="white" opacity="0.6"/>
        </g>

        <!-- Œil droit -->
        <g id="eye-right">
          <circle id="eye-right-outer" cx="290" cy="210" r="28" fill="#111"/>
          <circle id="pupil-right" cx="290" cy="210" r="12" fill="#00FFFF"/>
          <circle id="eye-right-highlight" cx="295" cy="205" r="5" fill="white" opacity="0.6"/>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Texte du logo -->
  <g id="logo-text" transform="translate(250, 480)">
    <text id="text-bbia" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="50" fill="#222" letter-spacing="2">BBIA</text>
    <text id="text-arkalia" y="0" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="24" fill="#666">Arkalia-Luna</text>
  </g>
</svg>

